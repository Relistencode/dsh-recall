<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrThin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="#ffffff"/>
  <text x="24" y="28" fill="#334155" font-size="13">Three-layer retrieval &amp; coverage gate — how one query is answered</text>

  <!-- Query -->
  <rect x="24" y="196" width="170" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="109" y="228" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="600">Query</text>
  <text x="109" y="248" text-anchor="middle" fill="#1e40af" font-size="11">user question</text>

  <!-- 三层:竖排 -->
  <g text-anchor="middle">
    <!-- Literal -->
    <rect x="300" y="52" width="190" height="64" rx="10" fill="#f0fdf4" stroke="#059669"/>
    <text x="395" y="82" fill="#065f46" font-size="13" font-weight="600">Literal</text>
    <text x="395" y="100" fill="#065f46" font-size="11">official FTS5 exact match</text>
    <!-- Fuzzy(主路径,高亮) -->
    <rect x="300" y="204" width="190" height="64" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
    <text x="395" y="234" fill="#92400e" font-size="13" font-weight="600">Fuzzy</text>
    <text x="395" y="252" fill="#92400e" font-size="11">trigram + bigram, typos OK</text>
    <!-- Semantic -->
    <rect x="300" y="356" width="190" height="64" rx="10" fill="#fdf2f8" stroke="#db2777"/>
    <text x="395" y="386" fill="#9d174d" font-size="13" font-weight="600">Semantic</text>
    <text x="395" y="404" fill="#9d174d" font-size="11">bge cosine, local int8</text>
  </g>

  <!-- 边:Query → 三层 -->
  <g fill="none" stroke-linecap="round">
    <line x1="194" y1="232" x2="298" y2="86"  stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrThin)"/>
    <line x1="194" y1="232" x2="298" y2="234" stroke="#2563eb" stroke-width="3"   marker-end="url(#arrMain)"/>
    <line x1="194" y1="232" x2="298" y2="384" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrThin)"/>
  </g>
  <!-- 边标签 -->
  <g font-size="11" fill="#64748b">
    <rect x="205" y="148" width="86" height="16" rx="3" fill="#ffffff"/>
    <text x="248" y="160" text-anchor="middle">exact keyword</text>
    <rect x="180" y="218" width="136" height="16" rx="3" fill="#ffffff"/>
    <text x="248" y="230" text-anchor="middle">fragment / typo tolerant</text>
    <rect x="200" y="298" width="98" height="16" rx="3" fill="#ffffff"/>
    <text x="249" y="310" text-anchor="middle">paraphrase</text>
  </g>

  <!-- Coverage gate 菱形 -->
  <polygon points="700,196 765,236 700,276 635,236" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="700" y="230" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="600">Coverage gate</text>
  <text x="700" y="248" text-anchor="middle" fill="#991b1b" font-size="11">≥ 90% coverage</text>

  <!-- 三层 → gate -->
  <g fill="none" stroke-linecap="round">
    <line x1="490" y1="84"  x2="698" y2="198" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrThin)"/>
    <line x1="490" y1="234" x2="633" y2="234" stroke="#2563eb" stroke-width="3"   marker-end="url(#arrMain)"/>
    <line x1="490" y1="388" x2="698" y2="274" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#arrThin)"/>
  </g>

  <!-- 输出 -->
  <rect x="790" y="196" width="150" height="80" rx="10" fill="#f0f9ff" stroke="#0284c7"/>
  <text x="865" y="226" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="600">Merged ranking</text>
  <text x="865" y="246" text-anchor="middle" fill="#0c4a6e" font-size="11">→ session groups</text>
  <text x="865" y="262" text-anchor="middle" fill="#0c4a6e" font-size="11">→ coarse recall</text>
  <line x1="765" y1="234" x2="788" y2="234" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>

  <!-- 降级链 -->
  <rect x="24" y="452" width="912" height="48" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="480" y="481" text-anchor="middle" fill="#64748b" font-size="12">Silent degradation — any layer failure falls back to the layer below: semantic → fuzzy → literal, never an error</text>
</svg>
